version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 28 * *"
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 28 * *"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
